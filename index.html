  <style>
    :root {
      --crimson: #AC152B;
      --raspberry: #D8345C;
      --teal: #35B1B4;
      --muted: #5C2432;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: var(--crimson);
      font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    main {
      text-align: center;
      padding: 2.5rem 1.25rem 3rem;
    }

    .logo {
      width: min(320px, 84vw);
      height: auto;
    }

    h1 {
      margin: 1.5rem 0 0;
      font-size: clamp(1.2rem, 2.4vw, 1.55rem);
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.35;
    }

    p {
      margin: 0.7rem 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .rule {
      width: 4.5rem;
      height: 4px;
      margin: 1.15rem auto 0;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--raspberry), var(--teal));
    }
  </style>
</head>
<body>
  <main>
    <img
      class="logo"
      src="/assets/brand/logo-full.svg"
      width="781"
      height="721"
      alt="Logo de Shelsea's Lab, une fiole en forme de S"
    >
    <h1>Shelsea's Lab — bientôt en ligne</h1>
    <p>Le portfolio de Shelsea Saint-Fleur.</p>
    <hr class="rule">
  </main>
</body>
</html>
